<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <link rel="stylesheet" href="./common.css">
    <style>
        /* 简单美化，可自行修改css */
        body {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div id="main" class="markdown-body"></div>
    <!-- 使用本地marked.js，不要写cdn地址 -->
    <script src="./marked.umd.js"></script>

    <script>
        // 加载你的md文件，修改这里的文件名可以切换不同md
        fetch("./nav" + ".md")
            .then(res => {
                if (!res.ok) throw new Error("md文件读取失败，检查路径大小写");
                return res.text();
            })
            .then(rawMd => {
                // 将md转为html填充页面
                document.querySelector("#main").innerHTML = marked.parse(rawMd);
                document.querySelectorAll('a[href^="mailto:"]').forEach(el => {
                    el.outerHTML = el.textContent;
                });
            })
            .catch(err => {
                document.querySelector("#main").innerText = "加载失败：" + err.message;
            });
    </script>
</iframe>
</body>
</html>
